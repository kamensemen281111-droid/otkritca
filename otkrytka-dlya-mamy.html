<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для Мамы ❤</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Georgia', 'Times New Roman', serif;
    background: linear-gradient(160deg, #fdf2e9 0%, #fde3e8 35%, #fbd7de 100%);
    overflow: hidden;
    padding: 20px;
  }

  /* Осыпающиеся цветы на фоне */
  .petals {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .petal {
    position: absolute;
    top: -15%;
    width: 14px;
    height: 14px;
    background: radial-gradient(circle at 30% 30%, #ffb3c8, #ff7ba1);
    border-radius: 50% 0 50% 0;
    opacity: 0.7;
    animation: fall linear infinite;
  }
  @keyframes fall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.8; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
  }

  .card {
    position: relative;
    z-index: 1;
    width: 520px;
    max-width: 96vw;
    background: linear-gradient(150deg, #ffffff 0%, #fff7f3 100%);
    border-radius: 24px;
    padding: 46px 38px 42px;
    box-shadow: 0 30px 70px rgba(180, 80, 100, 0.35);
    text-align: center;
    border: 1px solid rgba(255, 160, 180, 0.5);
    overflow: hidden;
  }

  /* Рисованные цветы по углам */
  .deco { position: absolute; width: 90px; height: 90px; opacity: 0.5; }
  .deco.tl { top: -18px; left: -18px; }
  .deco.br { bottom: -18px; right: -18px; transform: rotate(180deg); }

  .hearts {
    font-size: 42px;
    animation: pulse 1.6s ease-in-out infinite;
    margin-bottom: 8px;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50%     { transform: scale(1.18); }
  }

  h1 {
    font-size: 40px;
    color: #c05070;
    letter-spacing: 1px;
    margin-bottom: 6px;
    font-weight: normal;
  }
  .sub {
    color: #d98ba2;
    font-size: 15px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 26px;
  }

  .divider {
    width: 70%; height: 2px;
    margin: 0 auto 24px;
    background: linear-gradient(90deg, transparent, #f5b8c8, transparent);
  }

  p.message {
    font-size: 19px;
    line-height: 1.8;
    color: #7a4455;
    margin-bottom: 28px;
  }
  p.message .big { font-size: 22px; }

  .signature {
    font-style: italic;
    color: #a05a70;
    font-size: 17px;
  }

  /* Мерцающие звёздочки */
  .sparkles span {
    display: inline-block;
    width: 10px; height: 10px;
    background: #ffb6c9;
    margin: 18px 8px 0;
    clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    animation: twinkle 2s ease-in-out infinite;
  }
  .sparkles span:nth-child(2) { animation-delay: 0.5s; }
  .sparkles span:nth-child(3) { animation-delay: 1s; }
  .sparkles span:nth-child(4) { animation-delay: 1.4s; }
  @keyframes twinkle {
    0%,100% { transform: scale(0.6); opacity: 0.5; }
    50%     { transform: scale(1.1); opacity: 1; }
  }

  /* Акцент первого слова */
  .accent { font-size: 24px; font-weight: bold; color: #c05070; }
</style>
</head>
<body>

<div class="petals" id="petals"></div>

<div class="card">
  <!-- Угловые цветы (SVG) -->
  <svg class="deco tl" viewBox="0 0 100 100">
    <circle cx="20" cy="20" r="8" fill="#ffb3c8"/>
    <circle cx="35" cy="12" r="7" fill="#ffc7d6"/>
    <circle cx="14" cy="34" r="6" fill="#ffc7d6"/>
    <circle cx="45" cy="30" r="5" fill="#ff9db4"/>
    <path d="M15 25 Q 30 40 40 25" stroke="#7daf6b" stroke-width="2" fill="none"/>
  </svg>
  <svg class="deco br" viewBox="0 0 100 100">
    <circle cx="20" cy="20" r="8" fill="#ffb3c8"/>
    <circle cx="35" cy="12" r="7" fill="#ffc7d6"/>
    <circle cx="14" cy="34" r="6" fill="#ffc7d6"/>
    <circle cx="45" cy="30" r="5" fill="#ff9db4"/>
    <path d="M15 25 Q 30 40 40 25" stroke="#7daf6b" stroke-width="2" fill="none"/>
  </svg>

  <div class="hearts">&#x2764;&#xFE0F;</div>

  <h1>Мамочке моей</h1>
  <div class="sub">С любовью и теплом</div>

  <div class="divider"></div>

  <p class="message">
    <span class="accent">Спасибо</span> за каждый тёплый вечер,<br>
    за нежность, за твою заботу.<br>
    Ты для меня — опора, счастье,<br>
    и самая родная человек на свете.<br><br>
    <span class="big">Люблю тебя бесконечно!</span>
  </p>

  <div class="signature">— с глубокой любовью, твой ребёнок</div>

  <div class="sparkles">
    <span></span><span></span><span></span><span></span>
  </div>
</div>

<script>
  const petals = document.getElementById('petals');
  for (let i = 0; i < 26; i++) {
    const el = document.createElement('span');
    el.className = 'petal';
    const size = 8 + Math.random() * 10;
    el.style.left = Math.random() * 100 + '%';
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.animationDuration = (6 + Math.random() * 7) + 's';
    el.style.animationDelay = Math.random() * 8 + 's';
    petals.appendChild(el);
  }
</script>

</body>
</html>
